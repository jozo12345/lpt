name: Update start times

# Saves London Prayer Times start times into Firebase every week and keeps a backup copy in data/timetables.json.
on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday at 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - run: node scripts/update-lpt.mjs
        env:
          LPT_KEY: ${{ secrets.LPT_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Commit the backup copy if anything changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "salah-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timetables.json
          git commit -m "Update start times from London Prayer Times"
          git push
